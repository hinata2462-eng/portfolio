<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>どこしまった？ デモ</title>
<style>
/* 枠: パソコンでは説明＋スマホ型の枠、スマホでは全画面。アプリ本体は app.html（アドレスを書き換えるので枠の中で動かす） */
:root {
  --bg: #ECEDE8; --ink: #1B1E24; --muted: #5C616B; --line: #D3D5CE; --tape: #F2C230; --frame: #1B1E24;
  --body: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #12151C; --ink: #E8EAEE; --muted: #9EA4AF; --line: #2B303A; --frame: #000; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #12151C; --ink: #E8EAEE; --muted: #9EA4AF; --line: #2B303A; --frame: #000; color-scheme: dark; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.75; }
.page {
  min-height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 48px;
  padding: 28px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px));
}
.about { max-width: 340px; display: grid; gap: 14px; }
.tape { justify-self: start; background: var(--tape); color: #1B1E24; font-weight: 800; font-size: 22px; padding: 2px 12px; transform: rotate(-1.5deg); }
.about p { margin: 0; color: var(--muted); }
.about ul { margin: 0; padding-left: 1.2em; color: var(--muted); }
.about b { color: var(--ink); }
.reset { justify-self: start; font: inherit; font-size: 13.5px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.reset:focus-visible { outline: 2px solid var(--tape); outline-offset: 2px; }
.note { font-size: 12.5px; }
.phone { flex: none; width: 390px; height: min(800px, calc(100vh - 56px)); border: 10px solid var(--frame); border-radius: 44px; overflow: hidden; background: #000; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
.phone iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
.bar { display: none; }
@media (max-width: 820px) {
  .page { display: block; padding: 0; height: 100%; }
  .about { display: none; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 36px; box-sizing: border-box; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); background: var(--tape); color: #1B1E24; font-size: 12.5px; font-weight: 700; }
  .bar .reset { color: #1B1E24; border-color: rgba(0,0,0,.35); padding: 2px 8px; font-size: 12px; }
  .phone { width: 100%; height: calc(100% - 36px); border: 0; border-radius: 0; box-shadow: none; }
}
</style>
</head>
<body>
<div class="bar"><span>デモ版：見本のデータが入っています</span><button class="reset" type="button" data-reset>見本に戻す</button></div>
<div class="page">
  <div class="about">
    <span class="tape">どこしまった？</span>
    <p>しまった場所を写真で記録して、言葉で探せるiPhoneアプリです。これは同じアプリをブラウザで動かしたデモ版で、<b>見本の物と場所</b>が入っています。</p>
    <ul>
      <li>検索に「<b>上着</b>」と入れると「黒いジャンバー」が見つかります（言い換え辞書）</li>
      <li>物を開くと、しまった場所の道すじ（自宅 › 寝室 › …）が出ます</li>
      <li>「大事な物リスト」には、もしもの時に家族へ渡す物がまとまります</li>
    </ul>
    <p class="note">データはこのブラウザの中だけに保存され、外へは送られません。写真の撮影はiPhone版の機能です。</p>
    <button class="reset" type="button" data-reset>見本の状態に戻す</button>
  </div>
  <div class="phone"><iframe id="app" title="どこしまった？ アプリ本体"></iframe></div>
</div>
<script>
(function () {
  var KEY = "dokoshimatta.data.v1";
  var t = new Date();
  var iso = function (daysAgo) { return new Date(t.getTime() - daysAgo * 864e5).toISOString(); };
  var n = 0;
  var id = function () { n += 1; return "demo" + n.toString(36) + Math.random().toString(36).slice(2, 8); };

  function seed() {
    var places = {}, items = {};
    function place(name, parentId, daysAgo) {
      var p = { id: id(), name: name, parentId: parentId, photos: [], mark: null, createdAt: iso(daysAgo), updatedAt: iso(daysAgo), lastUsedAt: iso(daysAgo), movedAt: null, sample: true };
      places[p.id] = p; return p.id;
    }
    function item(name, placeId, kind, extra, daysAgo) {
      var it = { id: id(), name: name, photos: [], placeId: placeId, mark: null, scope: "", kind: kind, aliases: [], tags: [], memo: "", draft: false, state: "keep",
        createdAt: iso(daysAgo), updatedAt: iso(daysAgo), placeChangedAt: iso(daysAgo), confirmedAt: iso(daysAgo), checkedAt: null, deletedAt: null, sample: true, remind: null, important: null };
      for (var k in (extra || {})) it[k] = extra[k];
      items[it.id] = it;
    }
    var home = place("自宅", null, 40), jikka = place("実家", null, 40), work = place("職場", null, 40), car = place("車", null, 40);
    place("人に貸した・預けた", null, 40);
    var bed = place("寝室", home, 30), closet = place("クローゼット上段", bed, 30), box = place("冬物の青い箱", closet, 30);
    var wash = place("洗面所の引き出し", home, 25), shelf = place("リビングの書類棚", home, 20), storage = place("階段下の物置", home, 18);
    var desk = place("デスクの右の引き出し", work, 15), glove = place("助手席の前の物入れ", car, 12), oshiire = place("2階の押し入れ", jikka, 10);

    item("黒いジャンバー", box, "衣類", { tags: ["冬物"], remind: { type: "yearly", month: 11, day: 1 }, memo: "毎年11月に出す" }, 30);
    item("マフラー", box, "衣類", { tags: ["冬物"] }, 30);
    item("目薬", wash, "薬・ケア用品", {}, 25);
    item("保険の書類", shelf, "書類", { important: "保険証券" }, 20);
    item("通帳", shelf, "大事な書類", { important: "通帳" }, 20);
    item("扇風機", storage, "家電・季節用品", { remind: { type: "yearly", month: 6, day: 1 } }, 18);
    item("ひな人形", oshiire, "思い出の品", { remind: { type: "yearly", month: 2, day: 15 } }, 10);
    item("契約書の控え", desk, "書類", {}, 15);
    item("車検証", glove, "大事な書類", { tags: ["車の書類"], important: "車検証" }, 12);
    item("予備の鍵", wash, "工具・道具", { important: "予備の鍵", memo: "小さい缶の中" }, 8);

    var settings = {
      scopes: [],
      kinds: ["衣類", "靴", "大事な書類", "書類", "薬・ケア用品", "文具", "工具・道具", "家電・季節用品", "思い出の品", "その他"],
      aliasGroups: [
        ["ジャンバー", "ジャンパー", "ジャケット", "上着", "アウター"], ["コート", "外套"], ["セーター", "ニット"], ["手袋", "グローブ"],
        ["靴", "シューズ", "スニーカー"], ["鞄", "かばん", "カバン", "バッグ"], ["鍵", "かぎ", "カギ", "キー"], ["予備の鍵", "スペアキー", "合鍵"],
        ["印鑑", "はんこ", "判子", "ハンコ", "実印"], ["通帳", "預金通帳"], ["保険証", "健康保険証", "マイナ保険証"],
        ["マイナンバーカード", "マイナカード", "マイナンバー"], ["パスポート", "旅券"], ["保険証券", "保険の書類"],
        ["取扱説明書", "説明書", "取説", "マニュアル"], ["保証書", "保証"], ["年賀状", "はがき", "ハガキ"],
        ["充電器", "アダプター", "ケーブル", "充電ケーブル"], ["リモコン", "リモートコントローラー"], ["電池", "乾電池", "バッテリー"],
        ["目薬", "点眼薬"], ["薬", "くすり", "常備薬"], ["体温計", "検温"], ["ペン", "ボールペン", "筆記用具"], ["はさみ", "ハサミ", "鋏"],
        ["ドライバー", "ねじ回し"], ["工具", "道具"], ["扇風機", "サーキュレーター"], ["ストーブ", "ヒーター", "暖房"],
        ["ひな人形", "雛人形", "おひなさま"], ["五月人形", "兜", "こいのぼり"], ["書類", "資料", "プリント"]
      ],
      onboarded: true, lastBackupAt: iso(1), notify: false, notifyDraft: true, notifyCheck: true, notifySeason: true, foundCount: 0, reviewAsked: true
    };
    return { version: 1, items: items, places: places, history: {}, settings: settings };
  }

  function clearAll() {
    try {
      var del = [];
      for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf("dokoshimatta.") === 0) del.push(k); }
      del.forEach(function (k) { localStorage.removeItem(k); });
    } catch (e) {}
  }
  function ensureSeed() {
    try { if (!localStorage.getItem(KEY)) localStorage.setItem(KEY, JSON.stringify(seed())); } catch (e) {}
  }

  var frame = document.getElementById("app");
  ensureSeed();
  frame.src = "app.html";
  document.querySelectorAll("[data-reset]").forEach(function (b) {
    b.addEventListener("click", function () { clearAll(); ensureSeed(); frame.src = "app.html?r=" + Date.now(); });
  });
})();
</script>
</body>
</html>
