<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" /><meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1020" />
  <meta name="description" content="TCG Nexus — トレカの仕入・在庫・抽選・売却・利益をひとつに。" />
  <title>TCG Nexus(デモ)</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="demo-banner" role="note">
    <span class="demo-banner-text">デモ版：商品名・金額はすべて架空です</span>
    <button type="button" id="demo-reset" class="demo-reset">見本データに戻す</button>
  </div>
  <header class="app-header">
    <div class="brand">TCG <span>Nexus</span></div>
    <button id="btn-settings" class="icon-btn" aria-label="設定">⚙</button>
  </header>

  <main>
    <section id="view-home" class="view" aria-label="ホーム"></section>
    <section id="view-products" class="view" aria-label="商品"></section>
    <section id="view-lottery" class="view" aria-label="抽選"></section>
    <section id="view-money" class="view" aria-label="お金"></section>
  </main>

  <button id="fab" class="fab" aria-label="登録メニューを開く">＋</button>

  <nav class="bottom-nav" aria-label="メインナビゲーション">
    <button class="nav-item" data-view="home"><span class="ico" aria-hidden="true">🏠</span>ホーム</button>
    <button class="nav-item" data-view="products"><span class="ico" aria-hidden="true">📦</span>商品</button>
    <button class="nav-item" data-view="lottery"><span class="ico" aria-hidden="true">🎯</span>抽選</button>
    <button class="nav-item" data-view="money"><span class="ico" aria-hidden="true">💰</span>お金</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
  <!-- デモ版: Service Worker は登録しない(静的ホスティングのサブパスで常に最新ファイルを読む) -->
</body>
</html>
